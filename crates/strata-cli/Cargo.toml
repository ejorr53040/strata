[package]
name = "strata-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
strata-core = { path = "../strata-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
