<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d">
<title id="t">strata self-analysis: recall and review findings per run</title>
<desc id="d">1 runs. Recall of symbols, call sites and call targets against rust-analyzer, and code-review finding counts. Values are in the table below the chart.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--bar:#2a78d6}
@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--grid:#34332f;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--bar:#3987e5}}
text{font:12px system-ui,sans-serif;fill:var(--ink2)} .h{font-weight:600;fill:var(--ink);font-size:13px}
.grid{stroke:var(--grid);stroke-width:1} .ln{fill:none;stroke-width:2;stroke-linejoin:round}
.s1{stroke:var(--s1)} .s2{stroke:var(--s2)} .s3{stroke:var(--s3)}
.d1{fill:var(--s1)} .d2{fill:var(--s2)} .d3{fill:var(--s3)} .dot{stroke:var(--surface);stroke-width:2}
.bar{fill:var(--bar)} .v{fill:var(--ink);font-weight:600}
</style>
<rect width="760" height="500" fill="var(--surface)"/>
<text class="h" x="64" y="26">Recall vs rust-analyzer (%, higher is better)</text>
<line class="ln s1" x1="64" x2="82" y1="46" y2="46"/>
<text x="88" y="50">Symbols</text>
<line class="ln s2" x1="166" x2="184" y1="46" y2="46"/>
<text x="190" y="50">Call sites</text>
<line class="ln s3" x1="292" x2="310" y1="46" y2="46"/>
<text x="316" y="50">Targets</text>
<line class="grid" x1="64" x2="640" y1="230.0" y2="230.0"/>
<text x="56" y="234.0" text-anchor="end">90</text>
<line class="grid" x1="64" x2="640" y1="198.0" y2="198.0"/>
<text x="56" y="202.0" text-anchor="end">92</text>
<line class="grid" x1="64" x2="640" y1="150.0" y2="150.0"/>
<text x="56" y="154.0" text-anchor="end">95</text>
<line class="grid" x1="64" x2="640" y1="118.0" y2="118.0"/>
<text x="56" y="122.0" text-anchor="end">97</text>
<line class="grid" x1="64" x2="640" y1="70.0" y2="70.0"/>
<text x="56" y="74.0" text-anchor="end">100</text>
<polyline class="ln s1" points="352.0,70.0"/>
<circle class="dot d1" cx="352.0" cy="70.0" r="4"><title>run 1 (c46e806): Symbols recall 100.0%</title></circle>
<polyline class="ln s2" points="352.0,78.8"/>
<circle class="dot d2" cx="352.0" cy="78.8" r="4"><title>run 1 (c46e806): Call sites recall 99.5%</title></circle>
<polyline class="ln s3" points="352.0,131.6"/>
<circle class="dot d3" cx="352.0" cy="131.6" r="4"><title>run 1 (c46e806): Targets recall 96.2%</title></circle>
<text x="652" y="74.0">Symbols 100.0%</text>
<text x="652" y="88.0">Call sites 99.5%</text>
<text x="652" y="135.6">Targets 96.2%</text>
<text class="h" x="64" y="274">Code-review findings per run (lower is better)</text>
<line class="grid" x1="64" x2="640" y1="430" y2="430"/>
<text x="352.0" y="424" text-anchor="middle">n/a</text>
<text x="352.0" y="450" text-anchor="middle">run 1</text>
<text x="352.0" y="466" text-anchor="middle">c46e806</text>
</svg>
