# Copy to .github/workflows/ci.yml in a Rust project. Set the branch, and the
# system packages if the build needs any. Take pipeline updates by bumping @v1.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: ejorr53040/ci/.github/workflows/rust.yml@v1
    with:
      apt-packages: ""
